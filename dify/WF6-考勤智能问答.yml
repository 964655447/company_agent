app:
  description: WF-6 考勤智能问答：后端把 MySQL 统计好的数字传入，AI 只负责组织自然语言回答（不编数字）。
  icon: "\U0001F552"
  icon_background: '#6355F7'
  mode: workflow
  name: WF6-考勤智能问答
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: llm
        id: edge-start-llm
        source: node_start
        sourceHandle: source
        target: node_llm
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: edge-llm-end
        source: node_llm
        sourceHandle: source
        target: node_end
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: 前端/后端传入的提问与统计数据
          selected: false
          title: 开始
          type: start
          variables:
            - label: 用户提问
              max_length: 480
              options: []
              required: true
              type: text-input
              variable: question
            - label: 员工姓名
              max_length: 64
              options: []
              required: false
              type: text-input
              variable: employee_name
            - label: 查询周期
              max_length: 16
              options: []
              required: false
              type: text-input
              variable: period
            - label: 考勤统计JSON
              max_length: 4000
              options: []
              required: true
              type: paragraph
              variable: stats_json
        id: node_start
        position:
          x: 80
          y: 300
        positionAbsolute:
          x: 80
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 150
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 根据统计数字生成自然语言回答
          memory:
            window:
              enabled: false
              size: 10
          model:
            completion_params:
              temperature: 0.3
            mode: chat
            name: qwen3.5:4b
            provider: langgenius/ollama/ollama
          prompt_template:
            - id: wf6-sys
              role: system
              text: |
                你是公司考勤助手。后端已经从数据库统计好了考勤数字，你只需要根据这些数字用简洁、友好的中文回答员工的问题。

                规则：
                1. 只能使用下方提供的统计数据，严禁编造或修改任何数字。
                2. 回答控制在 3 句话以内，先直接给结论（出勤天数/迟到次数），再给一句简短建议或鼓励。
                3. 不要出现 JSON、代码块、字段名等技术内容，用自然语言表达。
                4. 如果统计为空（days 为 0），回复"本期暂无考勤记录"并建议员工先打卡。
            - id: wf6-user
              role: user
              text: |
                员工提问：{{#node_start.question#}}

                员工姓名：{{#node_start.employee_name#}}
                查询周期：{{#node_start.period#}}

                考勤统计数据（JSON，只能用这里的数字）：
                {{#node_start.stats_json#}}
          selected: false
          title: 考勤问答 LLM
          type: llm
          variables: []
          vision:
            enabled: false
        id: node_llm
        position:
          x: 380
          y: 300
        positionAbsolute:
          x: 380
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 120
      - data:
          desc: 输出自然语言回答
          outputs:
            - value_selector:
                - node_llm
                - text
              variable: answer
          selected: false
          title: 结束
          type: end
        id: node_end
        position:
          x: 680
          y: 300
        positionAbsolute:
          x: 680
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 90
