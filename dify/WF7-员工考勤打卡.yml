app:
  description: |-
    WF-7 员工考勤打卡（员工端）。
    员工输入特定指令（如"打卡""上班打卡""下班打卡"），工作流识别是上班卡还是下班卡，
    然后调用后端 /api/attendance/wf-checkin：由后端记录服务端上传时间、按上班时间判断是否迟到、
    并汇总本周与本月考勤数据，最后由 LLM 生成友好的播报话术。
    重要：打卡时间、迟到判定、周/月统计全部由后端完成，LLM 不参与任何数值计算。
  icon: "\U0001F551"
  icon_background: '#1D9E75'
  mode: workflow
  name: WF7-员工考勤打卡
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: parameter-extractor
        id: edge-start-extractor
        source: node_start
        sourceHandle: source
        target: node_extractor
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: parameter-extractor
          targetType: http-request
        id: edge-extractor-http
        source: node_extractor
        sourceHandle: source
        target: node_http
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: http-request
          targetType: llm
        id: edge-http-llm
        source: node_http
        sourceHandle: source
        target: node_llm
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: edge-llm-end
        source: node_llm
        sourceHandle: source
        target: node_end
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: 员工输入的打卡指令 + 员工工号
          selected: false
          title: 开始
          type: start
          variables:
            - label: 打卡指令
              max_length: 120
              options: []
              required: true
              type: text-input
              variable: command
            - label: 员工工号
              max_length: 16
              options: []
              required: true
              type: text-input
              variable: emp_id
        id: node_start
        position:
          x: 80
          y: 300
        positionAbsolute:
          x: 80
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 150
      - data:
          desc: 识别员工要打上班卡还是下班卡
          model:
            completion_params:
              temperature: 0.3
            mode: chat
            name: qwen3.5:4b
            provider: langgenius/ollama/ollama
          query:
            - node_start
            - command
          parameters:
            - name: action
              type: select
              options:
                - clock_in
                - clock_out
              description: clock_in=上班打卡（默认），clock_out=下班打卡
              required: true
          reasoning_mode: prompt
          vision:
            enabled: false
          instruction: |-
            判断员工这条指令是要打「上班卡」还是「下班卡」，输出 action。

            规则：
            1. 出现"下班""签退""收工""走人""下班卡"等 → action = clock_out
            2. 出现"上班""签到""开工""上班卡"等 → action = clock_in
            3. 只说"打卡""打个卡""签到"等没有明确上下班的 → action = clock_in（默认上班卡）

            示例：
            - "打卡" → clock_in
            - "上班打卡" → clock_in
            - "下班打卡" → clock_out
            - "我下班了，签退" → clock_out
          selected: false
          title: 识别打卡类型
          type: parameter-extractor
        id: node_extractor
        position:
          x: 380
          y: 300
        positionAbsolute:
          x: 380
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 120
      - data:
          desc: 调后端完成打卡写库、迟到判定与周/月度统计
          method: post
          url: 'http://host.docker.internal:8000/api/attendance/wf-checkin'
          authorization:
            type: no-auth
            config: null
          headers: 'Content-Type: application/json'
          params: ''
          body:
            type: json
            data:
              - key: ''
                type: text
                value: '{"emp_id": "{{#node_start.emp_id#}}", "action": "{{#node_extractor.action#}}", "command": "{{#node_start.command#}}"}'
          ssl_verify: true
          timeout:
            connect: null
            read: null
            write: null
          selected: false
          title: 打卡并统计
          type: http-request
          variables: []
        id: node_http
        position:
          x: 680
          y: 300
        positionAbsolute:
          x: 680
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 120
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 把后端算好的打卡结果与周月统计讲成一句话
          memory:
            window:
              enabled: false
              size: 10
          model:
            completion_params:
              temperature: 0.6
            mode: chat
            name: qwen3.5:4b
            provider: langgenius/ollama/ollama
          prompt_template:
            - id: wf7-sys
              role: system
              text: |-
                你是公司考勤助手。后端已经完成打卡记录、迟到判定和周/月度统计，返回了结构化 JSON。
                你的任务只是把这些数据用简洁友好的中文播报给员工。

                硬规则：
                1. 只能使用 JSON 里的数据，严禁编造任何数字、日期、时间。
                2. 第一句先说本次打卡结果：几点几分打卡、是否迟到、迟到多少分钟。
                3. 然后用一两句话播报本周和本月的累计情况（出勤天数、迟到次数、平均到岗时间）。
                4. checkin.duplicated 为 true 时，明确提醒"今天已打过该卡"，并附上原打卡时间。
                5. 迟到时语气温和但明确，提醒上班时间是 checkin.work_start；未迟到时给一句简短鼓励。
                6. 不要出现 JSON、字段名、代码块等技术内容，用自然语言表达。
                7. 时间用"X点X分"而不是"HH:MM"。
                8. 全部内容控制在 4 句话以内。
            - id: wf7-user
              role: user
              text: |-
                员工输入的指令：{{#node_start.command#}}

                后端返回的打卡与统计结果（JSON）：
                {{#node_http.body#}}

                请播报给员工。
          selected: false
          title: 生成播报
          type: llm
          variables: []
          vision:
            enabled: false
        id: node_llm
        position:
          x: 980
          y: 300
        positionAbsolute:
          x: 980
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 120
      - data:
          desc: 输出打卡播报
          outputs:
            - value_selector:
                - node_llm
                - text
              variable: answer
          selected: false
          title: 结束
          type: end
        id: node_end
        position:
          x: 1280
          y: 300
        positionAbsolute:
          x: 1280
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 90
