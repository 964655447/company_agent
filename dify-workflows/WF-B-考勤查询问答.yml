app:
  description: |-
    WF-B 考勤查询/问答（员工端，直连 MySQL，只读）。
    员工输入工号 + 自然语言问题（如“我这个月迟到几次”），工作流用 database 插件
    查询考勤记录与统计，由 LLM 生成中文回答。所有数字来自 MySQL 聚合，LLM 不编造。
  icon: "\U0001F4CA"
  icon_background: '#FFB020'
  mode: workflow
  name: WF-B 考勤查询问答
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: parameter-extractor
        id: edge-start-period
        source: node_start
        sourceHandle: source
        target: node_period
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: parameter-extractor
          targetType: tool
        id: edge-period-query
        source: node_period
        sourceHandle: source
        target: node_query
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: tool
          targetType: tool
        id: edge-query-stats
        source: node_query
        sourceHandle: source
        target: node_stats
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: tool
          targetType: llm
        id: edge-stats-llm
        source: node_stats
        sourceHandle: source
        target: node_llm
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: edge-llm-end
        source: node_llm
        sourceHandle: source
        target: node_end
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: 员工工号与问题
          selected: false
          title: 开始
          type: start
          variables:
            - label: 员工工号
              max_length: 16
              options: []
              required: true
              type: text-input
              variable: emp_id
            - label: 问题
              max_length: 200
              options: []
              required: true
              type: text-input
              variable: question
        id: node_start
        position:
          x: 80
          y: 300
        positionAbsolute:
          x: 80
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 150
      - data:
          desc: 从问题识别统计周期
          model:
            completion_params:
              temperature: 0.2
            mode: chat
            name: qwen3.5:4b
            provider: langgenius/ollama/ollama
          query:
            - node_start
            - question
          parameters:
            - name: period
              type: select
              required: true
              options:
                - value: week
                  label: 本周
                - value: month
                  label: 本月
              description: 根据问题判断统计周期，本周=week，本月=month
          title: 识别周期
          type: parameter-extractor
        id: node_period
        position:
          x: 380
          y: 300
        positionAbsolute:
          x: 380
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 150
      - data:
          desc: 查询考勤明细
          provider_name: hjlarry/database
          tool_name: sql_execute
          tool_label: SQL Execute
          tool_parameters:
            query: "SELECT a.work_date, a.type, a.checkin_time, a.is_late FROM attendance a JOIN employees e ON e.id=a.employee_id WHERE e.emp_id={{#node_start.emp_id#}} AND a.work_date >= CASE WHEN '{{#node_period.period#}}'='week' THEN DATE_SUB(CURDATE(),INTERVAL WEEKDAY(CURDATE()) DAY) ELSE DATE_SUB(CURDATE(),INTERVAL DAY(CURDATE())-1 DAY) END AND a.work_date <= CURDATE() ORDER BY a.work_date;"
            format: json
          title: 查询明细
          type: tool
        id: node_query
        position:
          x: 700
          y: 300
        positionAbsolute:
          x: 700
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 112
      - data:
          desc: 统计出勤天数与迟到次数
          provider_name: hjlarry/database
          tool_name: sql_execute
          tool_label: SQL Execute
          tool_parameters:
            query: "SELECT COUNT(DISTINCT a.work_date) AS days, SUM(CASE WHEN a.type='clock_in' AND a.is_late=1 THEN 1 ELSE 0 END) AS late_count, MIN(a.checkin_time) AS earliest, MAX(a.checkin_time) AS latest FROM attendance a JOIN employees e ON e.id=a.employee_id WHERE e.emp_id={{#node_start.emp_id#}} AND a.work_date >= CASE WHEN '{{#node_period.period#}}'='week' THEN DATE_SUB(CURDATE(),INTERVAL WEEKDAY(CURDATE()) DAY) ELSE DATE_SUB(CURDATE(),INTERVAL DAY(CURDATE())-1 DAY) END AND a.work_date <= CURDATE();"
            format: json
          title: 统计
          type: tool
        id: node_stats
        position:
          x: 1000
          y: 300
        positionAbsolute:
          x: 1000
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 112
      - data:
          desc: 生成中文回答
          model:
            completion_params:
              temperature: 0.7
            mode: chat
            name: qwen3.5:4b
            provider: langgenius/ollama/ollama
          prompt_template:
            - role: system
              text: "你是公司考勤助手。根据数据库返回的考勤明细与统计，用简洁友好的中文回答员工的问题，不要编造数字。迟到以 09:00 为准。"
            - role: user
              text: "员工工号 {{#node_start.emp_id#}} 的问题：{{#node_start.question#}}\n统计周期：{{#node_period.period#}}\n考勤明细：{{#node_query.json#}}\n统计：{{#node_stats.json#}}\n请给出回答。"
          title: 生成回答
          type: llm
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        id: node_llm
        position:
          x: 1320
          y: 300
        positionAbsolute:
          x: 1320
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 150
      - data:
          desc: 输出回答
          outputs:
            - value_selector:
                - node_llm
                - text
              variable: result
          title: 结束
          type: end
        id: node_end
        position:
          x: 1620
          y: 300
        positionAbsolute:
          x: 1620
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 112
