app:
  description: |-
    WF-A 员工考勤打卡（员工端，直连 MySQL）。
    员工输入工号 + 打卡指令（如“上班打卡”“下班打卡”），工作流用 database 插件
    直接写入 attendance 表：自动按工号解析员工主键、防重复打卡、按 09:00 判定迟到，
    并统计本周/本月出勤，最后由 LLM 生成友好播报。
    时间、迟到判定、统计聚合全部由 MySQL 完成，LLM 不参与数值计算。
  icon: "\U0001F551"
  icon_background: '#1D9E75'
  mode: workflow
  name: WF-A 员工考勤打卡
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: parameter-extractor
        id: edge-start-action
        source: node_start
        sourceHandle: source
        target: node_action
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: parameter-extractor
          targetType: tool
        id: edge-action-write
        source: node_action
        sourceHandle: source
        target: node_write
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: tool
          targetType: tool
        id: edge-write-record
        source: node_write
        sourceHandle: source
        target: node_record
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: tool
          targetType: tool
        id: edge-record-week
        source: node_record
        sourceHandle: source
        target: node_week
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: tool
          targetType: tool
        id: edge-week-month
        source: node_week
        sourceHandle: source
        target: node_month
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: tool
          targetType: llm
        id: edge-month-llm
        source: node_month
        sourceHandle: source
        target: node_llm
        targetHandle: target
        type: custom
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: edge-llm-end
        source: node_llm
        sourceHandle: source
        target: node_end
        targetHandle: target
        type: custom
    nodes:
      - data:
          desc: 员工工号与打卡指令
          selected: false
          title: 开始
          type: start
          variables:
            - label: 员工工号
              max_length: 16
              options: []
              required: true
              type: text-input
              variable: emp_id
            - label: 打卡指令
              max_length: 120
              options: []
              required: true
              type: text-input
              variable: command
        id: node_start
        position:
          x: 80
          y: 300
        positionAbsolute:
          x: 80
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 150
      - data:
          desc: 识别员工要打上班卡还是下班卡
          model:
            completion_params:
              temperature: 0.2
            mode: chat
            name: qwen3.5:4b
            provider: langgenius/ollama/ollama
          query:
            - node_start
            - command
          parameters:
            - name: action
              type: select
              required: true
              options:
                - value: clock_in
                  label: 上班打卡
                - value: clock_out
                  label: 下班打卡
              description: 根据指令判断打卡类型，上班打卡=clock_in，下班打卡=clock_out
          title: 识别打卡类型
          type: parameter-extractor
        id: node_action
        position:
          x: 380
          y: 300
        positionAbsolute:
          x: 380
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 150
      - data:
          desc: 写入打卡记录（按工号解析主键、防重复、判迟到）
          provider_name: hjlarry/database
          tool_name: sql_execute
          tool_label: SQL Execute
          tool_parameters:
            query: "INSERT INTO attendance (employee_id, checkin_time, type, is_late, work_date) SELECT e.id, NOW(), '{{#node_action.action#}}', CASE WHEN '{{#node_action.action#}}'='clock_in' AND TIME(NOW())>'09:00:00' THEN 1 ELSE 0 END, CURDATE() FROM employees e WHERE e.emp_id={{#node_start.emp_id#}} AND NOT EXISTS (SELECT 1 FROM attendance a WHERE a.employee_id=e.id AND a.work_date=CURDATE() AND a.type='{{#node_action.action#}}');"
            format: json
          title: 打卡写入
          type: tool
        id: node_write
        position:
          x: 700
          y: 300
        positionAbsolute:
          x: 700
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 112
      - data:
          desc: 取本次打卡记录
          provider_name: hjlarry/database
          tool_name: sql_execute
          tool_label: SQL Execute
          tool_parameters:
            query: "SELECT checkin_time, type, is_late FROM attendance a JOIN employees e ON e.id=a.employee_id WHERE e.emp_id={{#node_start.emp_id#}} AND a.work_date=CURDATE() AND a.type='{{#node_action.action#}}' ORDER BY a.id DESC LIMIT 1;"
            format: json
          title: 取打卡记录
          type: tool
        id: node_record
        position:
          x: 1000
          y: 300
        positionAbsolute:
          x: 1000
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 112
      - data:
          desc: 本周出勤统计
          provider_name: hjlarry/database
          tool_name: sql_execute
          tool_label: SQL Execute
          tool_parameters:
            query: "SELECT COUNT(DISTINCT a.work_date) AS days, SUM(CASE WHEN a.type='clock_in' AND a.is_late=1 THEN 1 ELSE 0 END) AS late_count, COUNT(*) AS records FROM attendance a JOIN employees e ON e.id=a.employee_id WHERE e.emp_id={{#node_start.emp_id#}} AND a.work_date>=DATE_SUB(CURDATE(),INTERVAL WEEKDAY(CURDATE()) DAY) AND a.work_date<=CURDATE();"
            format: json
          title: 本周统计
          type: tool
        id: node_week
        position:
          x: 1300
          y: 200
        positionAbsolute:
          x: 1300
          y: 200
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 112
      - data:
          desc: 本月出勤统计
          provider_name: hjlarry/database
          tool_name: sql_execute
          tool_label: SQL Execute
          tool_parameters:
            query: "SELECT COUNT(DISTINCT a.work_date) AS days, SUM(CASE WHEN a.type='clock_in' AND a.is_late=1 THEN 1 ELSE 0 END) AS late_count, COUNT(*) AS records FROM attendance a JOIN employees e ON e.id=a.employee_id WHERE e.emp_id={{#node_start.emp_id#}} AND a.work_date>=DATE_SUB(CURDATE(),INTERVAL DAY(CURDATE())-1 DAY) AND a.work_date<=CURDATE();"
            format: json
          title: 本月统计
          type: tool
        id: node_month
        position:
          x: 1300
          y: 420
        positionAbsolute:
          x: 1300
          y: 420
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 112
      - data:
          desc: 生成友好播报话术
          model:
            completion_params:
              temperature: 0.7
            mode: chat
            name: qwen3.5:4b
            provider: langgenius/ollama/ollama
          prompt_template:
            - role: system
              text: "你是公司考勤助手。下面给出了数据库返回的打卡写入结果、最新打卡记录、本周与本月统计，请用简洁友好的中文口语化播报，不要编造数字。若写入结果的 affected rows 为 0，说明今天已打过该卡，提示未重复记录。迟到判定以 09:00 为准。"
            - role: user
              text: "工号 {{#node_start.emp_id#}} 的打卡指令：{{#node_start.command#}}\n打卡写入结果：{{#node_write.json#}}\n最新打卡记录：{{#node_record.json#}}\n本周统计：{{#node_week.json#}}\n本月统计：{{#node_month.json#}}\n请生成播报。"
          title: 生成播报
          type: llm
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        id: node_llm
        position:
          x: 1620
          y: 300
        positionAbsolute:
          x: 1620
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 150
      - data:
          desc: 输出播报
          outputs:
            - value_selector:
                - node_llm
                - text
              variable: result
          title: 结束
          type: end
        id: node_end
        position:
          x: 1920
          y: 300
        positionAbsolute:
          x: 1920
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
        height: 112
