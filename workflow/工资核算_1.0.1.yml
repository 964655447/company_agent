    - data:
        code: "import pymysql\nfrom decimal import Decimal\nimport datetime\nimport\
          \ traceback\n\n\ndef main(id: str = None, input_data: dict = None, **kwargs)\
          \ -> dict:\n    if input_data:\n        id = input_data.get(\"id\", id)\n\
          \n    emp_id = id\n    if not emp_id:\n        return {\"report_data\":\
          \ {}, \"error_msg\": \"缺少员工工号 id\"}\n\n    def to_json(v):\n        if v\
          \ is None:\n            return None\n        if isinstance(v, Decimal):\n\
          \            return float(v)\n        if isinstance(v, (datetime.datetime,\
          \ datetime.date)):\n            return v.isoformat()\n        if isinstance(v,\
          \ datetime.timedelta):\n            return str(v)\n        if isinstance(v,\
          \ (bytes, bytearray)):\n            return v.decode('utf-8', errors='ignore')\n\
          \        return v\n\n    def fetch_one_dict(cur):\n        row = cur.fetchone()\n\
          \        if not row:\n            return None\n        columns = [desc[0]\
          \ for desc in cur.description]\n        return {col: to_json(val) for col,\
          \ val in zip(columns, row)}\n\n    conn = pymysql.connect(\n        host='192.168.45.82',\
          \  # 填入本机ip\n        port=3306,\n        user='root',\n        password='root',\n\
          \        database='company_agent',\n        charset='utf8mb4'\n    )\n\n\
          \    try:\n        with conn.cursor() as cur:\n            # 1. 查当月工资条（必须先存在）\n\
          \            cur.execute(\n                \"SELECT * FROM employee_salary_this_month\
          \ WHERE employee_id = %s\",\n                (str(emp_id),)\n          \
          \  )\n            next_month = fetch_one_dict(cur)\n\n            if not\
          \ next_month:\n                return {\n                    \"report_data\"\
          : {},\n                    \"error_msg\": f\"未找到员工 {emp_id} 的当月工资条数据。请先输入'工资条'并提供绩效系数。\"\
          \n                }\n\n            # 2. 查上个月工资数据（基准）\n            cur.execute(\n\
          \                \"SELECT * FROM employee_salary_last_month WHERE employee_id\
          \ = %s\",\n                (str(emp_id),)\n            )\n            current_month\
          \ = fetch_one_dict(cur)\n\n        # 生成报告日期：YYYY-MM-DD\n        report_date\
          \ = datetime.date.today().isoformat()\n\n        return {\n            \"\
          report_data\": {\n                \"report_date\": report_date,\n      \
          \          \"current_month\": current_month,\n                \"next_month\"\
          : next_month\n            },\n            \"error_msg\": \"\"\n        }\n\
