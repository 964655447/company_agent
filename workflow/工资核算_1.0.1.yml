    - data:
        code: "import pymysql\nfrom decimal import Decimal\nimport datetime\nimport\
          \ traceback\n\n\ndef main(id: str = None, performance_rating: float = None,\
          \ input_data: dict = None, **kwargs) -> dict:\n    # 兼容两种调用方式：\n    # 1.\
          \ Dify 把输入变量作为独立参数传入：main(id=..., performance_rating=...)\n    # 2. Dify\
          \ 把输入变量包成字典传入：main(input_data={...})\n    if input_data:\n        id = input_data.get(\"\
          id\", id)\n        performance_rating = input_data.get(\"performance_rating\"\
          , performance_rating)\n\n    # 1. 获取输入参数\n    emp_id = id\n    new_rating\
          \ = performance_rating\n\n    if not emp_id:\n        return {\"result\"\
          : {\"error\": \"缺少员工工号 id\"}}\n    if new_rating is None:\n        return\
          \ {\"result\": {\"error\": \"缺少绩效系数 performance_rating\"}}\n\n    try:\n\
          \        new_rating = Decimal(str(new_rating))\n    except Exception:\n\
          \        return {\"result\": {\"error\": \"performance_rating 必须是有效数字\"\
          }}\n\n    # 2. JSON 序列化转换函数\n    def to_json(v):\n        if v is None:\n\
          \            return None\n        if isinstance(v, Decimal):\n         \
          \   return float(v)\n        if isinstance(v, (datetime.datetime, datetime.date)):\n\
          \            return v.isoformat()\n        if isinstance(v, datetime.timedelta):\n\
          \            return str(v)\n        if isinstance(v, (bytes, bytearray)):\n\
          \            return v.decode('utf-8', errors='ignore')\n        return v\n\
          \n    # 3. 连接数据库\n    conn = pymysql.connect(\n        host='192.168.45.82',\
          \  # 填入本机ip\n        port=3306,\n        user='root',\n        password='root',\n\
          \        database='company_agent',\n        charset='utf8mb4'\n    )\n\n\
          \    try:\n        with conn.cursor() as cur:\n            # 4. 查询原员工数据（不查\
          \ performance_bonus，奖金由新公式独立计算）\n            cur.execute(\n            \
          \    \"SELECT employee_id, name, position, base_salary, allowance \"\n \
          \               \"FROM employee_salary_last_month WHERE employee_id = %s\"\
          ,\n                (str(emp_id),)\n            )\n            row = cur.fetchone()\n\
          \n            if not row:\n                return {\"result\": {\"error\"\
          : f\"未找到员工工号 {emp_id}\"}}\n\n            columns = [desc[0] for desc in\
          \ cur.description]\n            emp = dict(zip(columns, row))\n\n      \
          \      # 5. 用新绩效系数计算工资\n            base_salary = Decimal(str(emp[\"base_salary\"\
          ]))\n            allowance = Decimal(str(emp[\"allowance\"]))\n        \
          \    performance_bonus = new_rating * Decimal(\"10000\")\n            gross_salary\
          \ = base_salary + performance_bonus + allowance\n\n            emp[\"performance_rating\"\
          ] = new_rating\n            emp[\"performance_bonus\"] = performance_bonus\n\
          \            emp[\"gross_salary\"] = gross_salary\n\n            # 6. 插入/更新到当月工资条表\n\
          \            insert_sql = \"\"\"\n            INSERT INTO employee_salary_this_month\
          \ \n            (`employee_id`, `name`, `position`, `base_salary`, `performance_rating`,\
          \ \n             `performance_bonus`, `allowance`, `gross_salary`)\n   \
          \         VALUES (%s, %s, %s, %s, %s, %s, %s, %s)\n            ON DUPLICATE\
          \ KEY UPDATE\n            `name` = VALUES(`name`),\n            `position`\
          \ = VALUES(`position`),\n            `base_salary` = VALUES(`base_salary`),\n\
          \            `performance_rating` = VALUES(`performance_rating`),\n    \
          \        `performance_bonus` = VALUES(`performance_bonus`),\n          \
          \  `allowance` = VALUES(`allowance`),\n            `gross_salary` = VALUES(`gross_salary`)\n\
          \            \"\"\"\n\n            cur.execute(insert_sql, (\n         \
          \       emp_id,\n                emp.get(\"name\"),\n                emp.get(\"\
          position\"),\n                float(base_salary),\n                float(new_rating),\n\
          \                float(performance_bonus),\n                float(allowance),\n\
          \                float(gross_salary)\n            ))\n            conn.commit()\n\
          \n            # 7. 构造返回结果（JSON 安全）\n            result = {k: to_json(v)\
          \ for k, v in emp.items()}\n\n            # 8. 预生成 Markdown 工资条（输出节点可直接渲染）\n\
          \            markdown = f\"\"\"## 当月工资条\n\n| 项目 | 内容 |\n|---|---|\n| 工号\
          \ | {emp_id} |\n| 姓名 | {emp.get(\"name\", \"\")} |\n| 职位 | {emp.get(\"position\"\
          , \"\")} |\n| 基本工资 | ¥{float(base_salary):,.2f} |\n| 绩效系数 | {float(new_rating)}\
          \ |\n| 绩效奖金 | ¥{float(performance_bonus):,.2f} |\n| 补贴 | ¥{float(allowance):,.2f}\
          \ |\n| **应发合计** | **¥{float(gross_salary):,.2f}** |\n\"\"\"\n\n        return\
          \ {\n            \"result\": {\n                \"data\": result,\n    \
          \            \"markdown\": markdown,\n                \"message\": \"当月工资条生成成功\"\
          \n            }\n        }\n\n    except Exception as e:\n        return\
          \ {\n            \"result\": {\n                \"error\": str(e),\n   \
          \             \"traceback\": traceback.format_exc()\n            }\n   \
          \     }\n    finally:\n        try:\n            conn.close()\n        except\
          \ Exception:\n            pass"
        code_language: python3
        outputs:
          result:
            children: null
            type: object
        selected: false
        title: 生成工资条
