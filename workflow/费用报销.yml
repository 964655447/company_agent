    - data:
        code: "import pymysql\nimport json\n\ndef main(employee_id: str, applicant_name:\
          \ str, category: str, amount: str, ocr_raw: str):\n    # 1. 创建连接对象\n   \
          \ conn = pymysql.connect(\n        host='192.168.45.89',\n        port=3306,\n\
          \        user='root',\n        password='123456',\n        database='company_agent',\n\
          \        charset='utf8mb4'\n    )\n\n    try:\n        # 2. 创建游标对象\n   \
          \     cur = conn.cursor()\n\n        # 3. 执行插入 SQL（使用参数化查询，防止 SQL 注入）\n\
          \        sql = \"\"\"\n            INSERT INTO reimbursement \n        \
          \      (employee_id, applicant_name, category, amount, ocr_raw)\n      \
          \      VALUES\n              (%s, %s, %s, %s, %s)\n        \"\"\"\n    \
          \    cur.execute(sql, (employee_id, applicant_name, category, float(amount),\
          \ ocr_raw))\n\n        # 4. 提交事务\n        conn.commit()\n\n        # 5.\
          \ 获取新插入记录的 ID\n        new_id = cur.lastrowid\n\n        # 6. 关闭游标\n   \
          \     cur.close()\n\n        # 7. 返回结果\n        return {\n            \"\
          result\": json.dumps({\n                \"success\": True,\n           \
          \     \"id\": new_id,\n                \"message\": f\"报销记录插入成功，ID: {new_id}\"\
          \n            }, ensure_ascii=False)\n        }\n\n    except Exception\
          \ as e:\n        # 出错时回滚事务\n        conn.rollback()\n        return {\n\
          \            \"result\": json.dumps({\n                \"success\": False,\n\
          \                \"id\": 0,\n                \"message\": f\"插入失败: {str(e)}\"\
          \n            }, ensure_ascii=False)\n        }\n\n    finally:\n      \
          \  # 8. 关闭连接\n        conn.close()"
