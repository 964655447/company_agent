    - data:
        code: "# Dify 代码节点（来源/目标分表版，一条线兼容\"报告/工资表\"两种场景）\n# 入参：arg1 = 用户查询语句（含员工工号）,\
          \ performance_rating = 本月绩效系数（可空）\n# 逻辑：\n#   1) 从【上月表 SOURCE_TABLE】读取该员工全部数据\n\
          #   2) 按 performance_rating 是否为空分两种走法：\n#        - 有值 → 原有数据 + 本月新系数 → 计算奖金/应发，写入【本月新表\
          \ TARGET_TABLE】\n#        - 空值 → 报告场景：只读上月数据，并去 TARGET_TABLE 反查该员工是否有\"\
          现成\"本月数据\n#                 （之前通过工资条分支生成过）；有就回传，无就空\n#   3) 输出三个变量（prev/cur\
          \ 不含 no 列）：\n#        prev_record   = 上月全部信息\n#        cur_record    = 本月信息；有系数=刚重算，无系数但表里有=现成本月，无=空\
          \ {}\n#        cur_generated = \"true\"/\"false\"，标记本月是否有真实数据供下游判断展示\n#\
          \ 字段名全部从结果集动态获取，不写死，保证与表结构一致。\nimport re\nimport json\nfrom decimal import\
          \ Decimal\nimport pymysql\n\n\n# 这三列是\"本月要重算\"的，生成本月记录时由重算结果覆盖\nCOMPUTE_COLS\
          \ = {\"performance_rating\", \"performance_bonus\", \"gross_salary\"}\n\n\
          # 输出时排除的列（no 是序号列，不在结果展示里出现，写入数据库时仍保留）\nOUTPUT_EXCLUDE = {\"no\"}\n\n# =====\
          \ 数据库连接配置（按你的实际环境修改）=====\nDB_HOST = \"host.docker.internal\"\nDB_USER =\
          \ \"root\"\nDB_PASSWORD = \"root\"\nDB_NAME = \"company_agent\"        \
          \  # 真正装有 employee_salary / employee_salary_last_month 表的库\n\n# ===== 表名配置\
          \ =====\nSOURCE_TABLE = \"employee_salary\"   # 上月表（来源，只读）\nTARGET_TABLE\
          \ = \"employee_salary_last_month\"   # 本月新表（目标，写入）\n\n\ndef main(arg1, performance_rating)\
          \ -> dict:\n    # 调试上下文：所有未预期错误都会附上入参类型与值，方便定位 \"int is not iterable\" 这类莫名报错\n\
          \    _dbg = (\n        f\"arg1(type={type(arg1).__name__}, value={arg1!r});\
          \ \"\n        f\"performance_rating(type={type(performance_rating).__name__},\
          \ value={performance_rating!r})\"\n    )\n    # 1) 从查询语句中提取员工工号（对应表里的 employee_id\
          \ 列）\n    emp_id = _extract_emp_id(arg1)\n    if not emp_id:\n        raise\
          \ ValueError(f\"无法从查询中识别员工工号 | arg1={arg1!r}\")\n\n    # 2) 绩效系数：可空\n  \
          \  #    - 有值 → 走\"生成工资表\"分支：读+重算+写入 employee_salary_last_month\n    #  \
          \  - 空值 → 走\"生成报告\"分支：只读上月数据，不写任何表\n    #    这样「写入执行」节点在一条线里对两种场景都安全。\n\
          \    has_rating = performance_rating is not None and str(performance_rating).strip()\
          \ != \"\"\n    new_rating = None\n    if has_rating:\n        try:\n   \
          \         new_rating = float(performance_rating)\n        except (TypeError,\
          \ ValueError):\n            raise ValueError(f\"绩效系数不合法: {performance_rating!r}\"\
          )\n\n    conn = pymysql.connect(\n        host=DB_HOST,\n        user=DB_USER,\n\
          \        password=DB_PASSWORD,\n        database=DB_NAME,\n        charset=\"\
          utf8mb4\",\n    )\n    try:\n        try:\n            with conn.cursor()\
          \ as cur:\n                # 3) 从【上月表】读取该员工全部数据，列名由结果集动态获得\n           \
          \     cur.execute(\n                    f\"SELECT * FROM `{SOURCE_TABLE}`\
          \ WHERE `employee_id`=%s\",\n                    (emp_id,),\n          \
          \      )\n                row = cur.fetchone()\n                if not row:\n\
          \                    raise ValueError(f\"未找到 employee_id={emp_id} 的上月数据（来源表\
          \ {SOURCE_TABLE}）\")\n                src_cols = [d[0] for d in cur.description]\
          \       # 上月表实际列名\n                old = dict(zip(src_cols, row))      \
          \             # 上月全部字段\n\n                # 4) 原有数据不变：只保留\"非计算列\"，绩效三列交给本月重算\n\
          \                keep = {k: v for k, v in old.items() if k not in COMPUTE_COLS}\n\
          \n                # 5) 生成本月记录：不变字段 + 本月新绩效系数\n                #    keep\
          \ 已包含 no 列（来源表有 no 且不在 COMPUTE_COLS），\n                #    new_rec 因此含\
          \ no，写入目标表时不会触发 \"Field 'no' doesn't have a default value\"。\n         \
          \       new_rec = dict(keep)\n\n                if has_rating:\n       \
          \             # 6) 计算绩效奖金与应发合计\n                    #    公式：绩效奖金 = 绩效系数\
          \ × 10000（封顶 10000）\n                    new_rec[\"performance_rating\"\
          ] = round(new_rating, 2)\n                    base = float(new_rec[\"base_salary\"\
          ])\n                    allowance = float(new_rec[\"allowance\"])\n    \
          \                bonus = min(new_rating * 10000, 10000)\n              \
          \      new_rec[\"performance_bonus\"] = round(bonus, 2)\n              \
          \      new_rec[\"gross_salary\"] = round(base + bonus + allowance, 2)\n\n\
          \                    # 7) 写入【本月新表 employee_salary_last_month】：列名以目标表实际结构为准\n\
          \                    #    目标表若不存在，按来源表结构自动建（CREATE TABLE ... LIKE）\n   \
          \                 cur.execute(\n                        f\"CREATE TABLE\
          \ IF NOT EXISTS `{TARGET_TABLE}` LIKE `{SOURCE_TABLE}`\"\n             \
          \       )\n                    cur.execute(f\"SELECT * FROM `{TARGET_TABLE}`\
          \ LIMIT 0\")\n                    tgt_cols = [d[0] for d in cur.description]\
          \        # 本月新表实际列名\n                    write_cols = [c for c in tgt_cols\
          \ if c in new_rec]  # 只写两张表都有的列（含 no）\n                    col_sql = \"\
          , \".join(f\"`{c}`\" for c in write_cols)\n                    placeholders\
          \ = \", \".join([\"%s\"] * len(write_cols))\n                    vals =\
          \ [new_rec.get(c) for c in write_cols]\n                    update_sql =\
          \ \", \".join(f\"`{c}`=VALUES(`{c}`)\" for c in write_cols)\n          \
          \          cur.execute(\n                        f\"INSERT INTO `{TARGET_TABLE}`\
          \ ({col_sql}) VALUES ({placeholders}) \"\n                        f\"ON\
          \ DUPLICATE KEY UPDATE {update_sql}\",\n                        vals,\n\
          \                    )\n                    conn.commit()\n            \
          \        existing_cur = None\n                else:\n                  \
          \  # 报告场景：去 TARGET_TABLE 反查\"现成本月数据\"，\n                    # 这样报告分支也能看到之前写入的数据。\n\
          \                    # 先判断表是否存在（如果从未生成过工资条，目标表还没建）。\n                  \
          \  cur.execute(\n                        \"SELECT 1 FROM INFORMATION_SCHEMA.TABLES\
          \ \"\n                        \"WHERE TABLE_SCHEMA=%s AND TABLE_NAME=%s\
          \ LIMIT 1\",\n                        (DB_NAME, TARGET_TABLE),\n       \
          \             )\n                    if cur.fetchone() is None:\n      \
          \                  existing_cur = None        # 表还没建过，本月肯定没数据\n        \
          \            else:\n                        cur.execute(\n             \
          \               f\"SELECT * FROM `{TARGET_TABLE}` WHERE `employee_id`=%s\"\
          ,\n                            (emp_id,),\n                        )\n \
          \                       existing_row = cur.fetchone()\n                \
          \        if existing_row is None:\n                            existing_cur\
          \ = None    # 表有但这个员工没数据\n                        else:\n              \
          \              cur_cols = [d[0] for d in cur.description]\n            \
          \                existing_cur = dict(zip(cur_cols, existing_row))\n    \
          \                        # 排除 no 列（与写入时展示口径一致）\n                       \
          \     existing_cur = {\n                                k: v for k, v in\
          \ existing_cur.items()\n                                if k not in OUTPUT_EXCLUDE\n\
          \                            }\n\n            # 8) Decimal 转 float，避免 Dify\
          \ 返回结果时 JSON 序列化失败；\n            #    输出都序列化为 JSON 字符串（String 类型）。\n   \
          \         #    原因：Dify 的 Object 类型输出在下游\"输入变量\"里会传空，String 则稳定可引用。\n   \
          \         prev_record = {\n                k: float(v) if isinstance(v,\
          \ Decimal) else v\n                for k, v in old.items() if k not in OUTPUT_EXCLUDE\n\
          \            }\n            if has_rating:\n                # 有系数 → 本月是重算后的真实数据\n\
          \                cur_record = {\n                    k: float(v) if isinstance(v,\
          \ Decimal) else v\n                    for k, v in new_rec.items() if k\
          \ not in OUTPUT_EXCLUDE\n                }\n                cur_generated\
          \ = \"true\"\n            elif existing_cur is not None:\n             \
          \   # 无系数但 TARGET_TABLE 已有本月数据（之前生成过）→ 读出来当 cur_record\n               \
          \ cur_record = {\n                    k: float(v) if isinstance(v, Decimal)\
          \ else v\n                    for k, v in existing_cur.items()\n       \
          \         }\n                cur_generated = \"true\"\n            else:\n\
          \                # 无系数 + 也没现成本月数据 → 本月确无数据\n                cur_record =\
          \ {}\n                cur_generated = \"false\"\n            return {\n\
          \                \"prev_record\": json.dumps(prev_record, ensure_ascii=False,\
          \ default=str),\n                \"cur_record\": json.dumps(cur_record,\
          \ ensure_ascii=False, default=str),\n                \"cur_generated\":\
          \ cur_generated,\n            }\n        except ValueError:\n          \
          \  # 已知业务校验错误（找不到工号/数据、系数非法）原样抛出\n            raise\n        except Exception\
          \ as e:\n            # 未知错误：附上入参类型 + 完整堆栈，方便定位 \"int is not iterable\" 这类莫名报错\n\
          \            import traceback\n            raise RuntimeError(\n       \
          \         f\"写入执行内部错误 | {_dbg}\\n--- original ---\\n\"\n               \
          \ f\"{type(e).__name__}: {e}\\n{traceback.format_exc()}\"\n            )\
          \ from e\n    finally:\n        conn.close()\n\n\ndef _extract_emp_id(query):\n\
          \    \"\"\"从查询/工号输入中提取员工工号（对应表 employee_id 列）\"\"\"\n    if query is None:\n\
          \        return None\n    s = str(query)\n    patterns = [\n        r\"\
          工号[是为：:\\s]*([A-Za-z0-9]+)\",\n        r\"员工[编号是为：:\\s]*([A-Za-z0-9]+)\"\
