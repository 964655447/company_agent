    - data:
        code: "# Dify 代码节点（查询节点）：传入工号，返回该员工全部个人信息 + 薪资（横向二维表格）\n# 入参：arg1 = 员工工号 employee_id\n\
          # 输出：{\"result\": \"Markdown 表格字符串\"}，横向（表头是所有字段名，值是一行），\n#       字段名与建表\
          \ DDL 一致（employee_id），已去掉 NO 字段\nimport pymysql\nfrom decimal import Decimal\n\
          \n# ===== 连接与表名（按你的环境修改）=====\nDB_HOST = \"host.docker.internal\"\nDB_PORT\
          \ = 3306\nDB_USER = \"root\"\nDB_PASSWORD = \"root\"\nDB_NAME = \"company_agent\"\
          \nQUERY_TABLE = \"employee_salary\"   # 查本月新表则改成 new_test\n\n# 需要排除的字段（按需增删），比较时大小写不敏感\n\
          EXCLUDE_COLS = {\"no\"}\n\n# 规范列名（与建表 DDL 一致）：校正 MySQL 可能返回的小写列名（如 employee_id），\n\
          # 并作为横向表格的字段顺序。\nCANONICAL_COLS = [\n    \"NO\", \"employee_id\", \"name\"\
          , \"position\", \"base_salary\",\n    \"performance_rating\", \"performance_bonus\"\
          , \"allowance\", \"gross_salary\",\n]\nCANON_MAP = {c.lower(): c for c in\
          \ CANONICAL_COLS}\n\n\ndef _format_value(v):\n    \"\"\"Decimal 转 float，float\
          \ 统一两位小数；其他类型原样 str。\"\"\"\n    if isinstance(v, Decimal):\n        v =\
          \ float(v)\n    if isinstance(v, float):\n        v = f\"{v:.2f}\"\n   \
          \ return str(v)\n\n\ndef main(arg1: str) -> dict:\n    con = pymysql.connect(\n\
          \        host=DB_HOST, port=DB_PORT, user=DB_USER, password=DB_PASSWORD,\n\
          \        database=DB_NAME, charset=\"utf8mb4\",\n    )\n    try:\n     \
          \   with con.cursor() as cursor:\n            sql = f\"SELECT * FROM `{QUERY_TABLE}`\
          \ WHERE `employee_id` = %s\"\n            cursor.execute(sql, (arg1,))\n\
          \            row = cursor.fetchone()\n            if not row:\n        \
          \        return {\"result\": \"未找到该员工信息\"}\n            cols = [d[0] for\
          \ d in cursor.description]   # 数据库返回的原始列名\n            # 1) 计算横向表格的列顺序：按\
          \ CANONICAL_COLS 声明的顺序，\n            #    只保留数据库实际返回的、且不在 EXCLUDE_COLS 中的列\n\
          \            display_cols = [\n                CANON_MAP.get(c.lower(),\
          \ c)\n                for c in CANONICAL_COLS\n                if c.lower()\
          \ in {x.lower() for x in cols} and c.lower() not in EXCLUDE_COLS\n     \
          \       ]\n            # 兜底：如果 CANONICAL_COLS 没覆盖的列，追加在末尾（数据库原始顺序）\n   \
          \         canon_lower = {c.lower() for c in CANONICAL_COLS}\n          \
          \  for c in cols:\n                if c.lower() not in canon_lower and c.lower()\
          \ not in EXCLUDE_COLS:\n                    display_cols.append(CANON_MAP.get(c.lower(),\
          \ c))\n            if not display_cols:\n                return {\"result\"\
          : \"未找到该员工信息\"}\n            # 2) 拿这条记录对应各列的值（按 display_cols 同顺序）\n    \
          \        row_map = {c.lower(): v for c, v in zip(cols, row)}\n         \
          \   data_values = []\n            for dc in display_cols:\n            \
          \    raw_key = next((c for c in cols if CANON_MAP.get(c.lower(), c) == dc),\
          \ None)\n                v = row_map.get(raw_key.lower() if raw_key else\
          \ dc.lower())\n                data_values.append(_format_value(v))\n  \
          \          # 3) 拼成横向 Markdown 表格\n            header_line = \"| \" + \"\
          \ | \".join(display_cols) + \" |\"\n            sep_line = \"| \" + \" |\
          \ \".join(\"---\" for _ in display_cols) + \" |\"\n            data_line\
          \ = \"| \" + \" | \".join(data_values) + \" |\"\n            table = \"\\\
          n\".join([header_line, sep_line, data_line])\n            return {\"result\"\
          : table}\n    finally:\n        con.close()\n"
        code_language: python3
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: 查询执行
        type: code
        variables:
